<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carte Utilisateur</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="bg-gray-950 py-12">

  <div class="max-w-md mx-auto">
    <!-- Carte Utilisateur -->
    <div class="bg-gradient-to-br from-zinc-900 to-zinc-800 rounded-3xl overflow-hidden shadow-2xl border border-zinc-700">
      
      <!-- Bannière -->
      <div class="h-32 bg-gradient-to-r from-purple-600 via-pink-500 to-violet-600 relative">
        <div class="absolute -bottom-12 left-6">
          <!-- Avatar -->
          <img src="https://i.pravatar.cc/128?img=68" 
               alt="Avatar" 
               class="w-24 h-24 rounded-2xl border-4 border-zinc-800 object-cover shadow-lg">
        </div>
      </div>

      <div class="pt-16 pb-6 px-6">
        <!-- Nom + Pseudo -->
        <div class="flex justify-between items-start">
          <div>
            <h2 class="text-2xl font-bold text-white">Jean Dupont</h2>
            <p class="text-zinc-400">@jeandupont</p>
          </div>
          <button class="bg-white text-black px-6 py-2 rounded-full font-semibold hover:bg-zinc-200 transition">
            Suivre
          </button>
        </div>

        <!-- Bio -->
        <p class="mt-4 text-zinc-300 text-sm leading-relaxed">
          Développeur Full Stack passionné par le design et les interfaces fluides. 
          Toujours à la recherche de nouvelles idées créatives.
        </p>

        <!-- Stats -->
        <div class="flex gap-6 mt-6 text-sm">
          <div>
            <span class="font-semibold text-white">248</span>
            <span class="text-zinc-500 ml-1">Abonnements</span>
          </div>
          <div>
            <span class="font-semibold text-white">12.4k</span>
            <span class="text-zinc-500 ml-1">Abonnés</span>
          </div>
          <div>
            <span class="font-semibold text-white">142</span>
            <span class="text-zinc-500 ml-1">Posts</span>
          </div>
        </div>

        <!-- Localisation + Date -->
        <div class="flex items-center gap-4 mt-5 text-zinc-400 text-sm">
          <div class="flex items-center gap-1.5">
            <i class="fa-solid fa-location-dot"></i>
            <span>Paris, France</span>
          </div>
          <div class="flex items-center gap-1.5">
            <i class="fa-solid fa-calendar"></i>
            <span>Membre depuis mars 2023</span>
          </div>
        </div>

        <!-- Boutons d'action -->
        <div class="grid grid-cols-2 gap-3 mt-8">
          <button class="bg-zinc-800 hover:bg-zinc-700 text-white py-3 rounded-2xl font-medium transition">
            Message
          </button>
          <button class="bg-violet-600 hover:bg-violet-500 text-white py-3 rounded-2xl font-medium transition">
            Voir le profil
          </button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
